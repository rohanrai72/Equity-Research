services:
  - type: web
    name: equity-research
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Optional: set PROXY_URL in the Render dashboard if NSE/Yahoo block Render IPs
